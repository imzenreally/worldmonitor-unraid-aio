name: Seed Freshness Monitor

on:
  # This downstream Unraid fork does not own the hosted World Monitor seed
  # pipeline. Keep the probe available for diagnosis without polling upstream
  # production or generating recurring failure notifications.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Check seed metadata freshness
        run: node scripts/check-seed-freshness.mjs
